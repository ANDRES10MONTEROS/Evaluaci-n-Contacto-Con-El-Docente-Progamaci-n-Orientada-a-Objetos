<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Streaming Go</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Historial de Usuario {{.UserID}}</h1>
        <div class="nav">
            <a href="/users">Volver a Usuarios</a>
        </div>
        <ul>
            {{range .History}}
            <li>{{.ID}} - {{.Title}} ({{.Type}}) - {{.Duration}} min</li>
            {{end}}
        </ul>
    </div>
</body>
</html>
